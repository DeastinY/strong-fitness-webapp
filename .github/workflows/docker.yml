name: Build and push Docker images

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  OWNER: deastiny
  REPO: strong-fitness-webapp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}-backend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}-frontend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compute new chart version
        id: chart
        run: |
          CURRENT=$(grep '^version:' trains/community/fitness-tracker/*/app.yaml | grep -oP '\d+\.\d+\.\d+' | sort -V | tail -1)
          IFS='.' read -r major minor patch <<< "$CURRENT"
          NEW="$major.$minor.$((patch + 1))"
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "new=$NEW" >> $GITHUB_OUTPUT

      - name: Copy chart to new version
        run: |
          cp -r trains/community/fitness-tracker/${{ steps.chart.outputs.current }} \
                trains/community/fitness-tracker/${{ steps.chart.outputs.new }}

      - name: Update chart version and image tags
        run: |
          sed -i "s/^version: .*/version: ${{ steps.chart.outputs.new }}/" \
            trains/community/fitness-tracker/${{ steps.chart.outputs.new }}/app.yaml
          sed -i "s/tag: .*/tag: ${{ steps.tag.outputs.tag }}/" \
            trains/community/fitness-tracker/${{ steps.chart.outputs.new }}/ix_values.yaml

      - name: Commit and push chart bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trains/
          git commit -m "chore: bump chart to ${{ steps.chart.outputs.new }} [skip ci]"
          git push
